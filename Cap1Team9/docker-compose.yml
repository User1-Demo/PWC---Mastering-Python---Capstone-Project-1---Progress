services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: claimiq
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U claimiq" ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
