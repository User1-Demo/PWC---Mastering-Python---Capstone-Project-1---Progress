services:

  db:
    image: postgres:16
    container_name: claimiq-postgres

    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: claimiq_dev_password

    volumes:
      - claimiq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U claimiq -d claimiq"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build: .
    container_name: claimiq-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      SECRET_KEY: change-before-deployment
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      DATABASE_URL: postgresql+psycopg2://claimiq:claimiq_dev_password@db:5432/claimiq

      UPLOAD_DIR: /app/uploads
      VECTOR_DB_DIR: /app/vector_db

      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200
      RETRIEVAL_TOP_K: 5

    ports:
      - "8000:8000"

    volumes:
      - claimiq_uploads:/app/uploads
      - claimiq_vectors:/app/vector_db


volumes:
  claimiq_postgres_data:
  claimiq_uploads:
  claimiq_vectors: