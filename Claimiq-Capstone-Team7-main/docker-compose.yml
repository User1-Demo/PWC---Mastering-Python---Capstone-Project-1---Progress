version: "3.9"

services:
  db:
    image: postgres:16
    container_name: claimiq-postgres
    restart: always
    environment:
      POSTGRES_USER: claimiq_user
      POSTGRES_PASSWORD: claimiq_pass
      POSTGRES_DB: claimiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: