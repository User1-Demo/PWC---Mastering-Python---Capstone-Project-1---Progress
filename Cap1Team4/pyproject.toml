[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsiq"
version = "0.1.0"
description = "Intelligent Insurance Claims and Policy Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4.1,<6",
    "cryptography>=42,<51",
    "email-validator>=2.1,<3",
    "fastapi>=0.110,<1",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pyodbc>=5.1,<6",
    "PyJWT>=2.8,<3",
    "pydantic-settings>=2.2,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
claimsiq-validate-schema = "app.db.schema_validation:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
