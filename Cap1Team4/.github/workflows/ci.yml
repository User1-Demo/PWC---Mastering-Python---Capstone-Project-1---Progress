name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: sqlite:///./claims.db
          SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      - run: docker build -t claimsiq-api .
